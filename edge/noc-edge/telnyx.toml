name = "noc-edge"
main = "src/index.ts"
compatibility_date = "2026-05-01"

[[actors]]
binding = "SITES"
type = "SiteState"

[[actors]]
binding = "REGIONS"
type = "RegionState"

# Reference binder: mux contingency for DEBUGLOG #4 — routes actor calls
# through the one working Counter instance (noc-actor-canary) when the
# flag/actor_mode KV flag is "mux".
[[actors]]
binding = "MUX"
type = "Counter"

[storage.kv.CACHE]
id = "f08b8bc7-4208-4c63-9e8f-0f851d02cd0f"

[[secrets]]
binding = "TELNYX_PUBLIC_KEY"
name = "TELNYX_PUBLIC_KEY"

[[secrets]]
binding = "MCP_TOKEN"
name = "MCP_TOKEN"

[[secrets]]
binding = "OPS_TOKEN"
name = "OPS_TOKEN"

[[secrets]]
binding = "PIN_PEPPER"
name = "PIN_PEPPER"

[[secrets]]
binding = "ONCALL_NUMBER"
name = "ONCALL_NUMBER"

[[secrets]]
binding = "SEED_LOCAL"
name = "SEED_LOCAL"

[[secrets]]
binding = "DEMO_GUIDE"
name = "DEMO_GUIDE"

[edge_compute]
func_id = "41d2a334-70ab-4bd3-b9a9-b47a8179602c"
func_name = "noc-edge"
